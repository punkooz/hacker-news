version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hackernews
    ports:
      - "5433:5432" # Use 5433 to avoid conflict with local Postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hackernews
      JWT_SECRET: dev_secret
    depends_on:
      - db
    command: sh -c "until nc -z db 5432; do echo waiting for db; sleep 2; done; npm run migrate && npm start"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
